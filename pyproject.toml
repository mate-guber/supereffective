[project]
name = "supereffective"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]                # Look in the current directory (supereffective/)
include = ["app*", "ml*", "data*"]  # Explicitly include these top-level packages
exclude = ["tests*", "scripts*", "docs*", "templates*", "static*"]  # Skip non-package folders